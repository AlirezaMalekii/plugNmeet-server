name: iNeshast pinned images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: redis:8.10
            name: redis
          - source: mariadb:12.3
            name: mariadb
          - source: nats:2.15-alpine
            name: nats
          - source: livekit/livekit-server:v1.9.11
            name: livekit
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror dependency
        env:
          SOURCE: ${{ matrix.source }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          docker pull "$SOURCE"
          target="ghcr.io/alirezamalekii/plugnmeet-$NAME:$GITHUB_SHA"
          docker tag "$SOURCE" "$target"
          docker push "$target"
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build server from fork
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker-build/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/alirezamalekii/plugnmeet-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AlirezaMalekii/plugNmeet-server
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build recorder from pinned source
        uses: docker/build-push-action@v7
        with:
          context: components/recorder
          file: components/recorder/docker-build/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/alirezamalekii/plugnmeet-recorder:${{ github.sha }}
