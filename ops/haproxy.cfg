global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2
    stats socket /run/haproxy/admin.sock mode 660 level admin
defaults
    log global
    timeout connect 10s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h
frontend http
    bind :80
    mode http
    acl acme path_beg /.well-known/acme-challenge/
    use_backend certbot if acme
    http-request redirect scheme https code 301 unless acme
backend certbot
    mode http
    server local 127.0.0.1:9080
frontend tls
    bind :443 ssl crt /etc/haproxy/ssl/
    mode tcp
    use_backend turn if { ssl_fc_sni -i turn.ineshast.ir }
    default_backend websites
backend turn
    mode tcp
    server turn 127.0.0.1:5349 check
backend websites
    mode tcp
    server internal 127.0.0.1:18081 send-proxy
frontend websites_http
    bind 127.0.0.1:18081 accept-proxy
    mode http
    http-request set-header X-Forwarded-Proto https
    acl meeting_domain hdr(host) -i meet.ineshast.ir
    http-request deny deny_status 404 unless meeting_domain
    use_backend livekit if { path_beg /livekit }
    use_backend nats if { path_beg /ws }
    default_backend plugnmeet
backend plugnmeet
    mode http
    option forwardfor
    option httpchk GET /healthCheck
    server api 127.0.0.1:18080 check
backend livekit
    mode http
    option forwardfor
    http-request set-path %[path,regsub(^/livekit/,/)]
    server media 127.0.0.1:7880 check
backend nats
    mode http
    option forwardfor
    http-request set-path %[path,regsub(^/ws/,/)]
    server ws 127.0.0.1:18222 check
